services:
  rex-xstream:
    image: ghcr.io/leleasley/rex-xstream:${REX_XSTREAM_VERSION:-latest}
    container_name: rex-xstream
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "9981:9981"
    volumes:
      - ./data:/data
    mem_limit: 1g
    memswap_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9981/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
